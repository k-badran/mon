# Local development stack.
#
# Credentials come from .env with development defaults, so the same compose
# file describes the shape of the deployment while never hardcoding a secret
# that could accidentally follow the project to a server.
#
#   pnpm db:up      start
#   pnpm db:down    stop (data survives)
#   pnpm db:reset   stop and DELETE the volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: umzugplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umzugplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umzugplus}
      POSTGRES_DB: ${POSTGRES_DB:-umzugplus_dev}
      # Pinned so date and timestamp behaviour matches production exactly.
      TZ: ${BUSINESS_TIMEZONE:-Europe/Berlin}
      PGTZ: ${BUSINESS_TIMEZONE:-Europe/Berlin}
    ports:
      # Host port is configurable: 5432 is often already taken by another
      # project's database.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Anything dropped here runs once, on first initialisation only.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umzugplus} -d ${POSTGRES_DB:-umzugplus_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: umzugplus-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "${REDIS_PORT:-6390}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
