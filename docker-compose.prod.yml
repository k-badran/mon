# Production stack.
#
# Deliberately different from the development file in three ways:
#
#   1. **No default credentials.** Every secret uses `${VAR:?message}`, so
#      compose refuses to start rather than quietly falling back to a value
#      that is published in this repository.
#
#   2. **The database is not exposed to the internet.** Postgres and Redis have
#      no `ports:` mapping at all — they are reachable only from other services
#      on the internal network. Connect for maintenance over an SSH tunnel.
#
#   3. **Migrations run as their own service**, once, before the API starts.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${BUSINESS_TIMEZONE:-Europe/Berlin}
      PGTZ: ${BUSINESS_TIMEZONE:-Europe/Berlin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount a host directory so `pnpm db:dump` output survives the container.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]
    # Postgres defaults assume a small machine; raise these to match the server.
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      -c work_mem=${POSTGRES_WORK_MEM:-8MB}
      -c log_min_duration_statement=1000

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Runs to completion, then exits. The API waits for it.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "packages/db/dist/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-umzugplus-api}
      WEB_ORIGIN: ${WEB_ORIGIN}
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Berlin}
      # Outbound email. Required, not optional: in production MAIL_DRIVER
      # defaults to smtp and the config schema refuses to start without a host,
      # user and password — a deployment that boots and silently drops every
      # password reset is worse than one that refuses to boot.
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      MAIL_FROM: ${MAIL_FROM:-UmzugPlus <info@moveongo.de>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-UmzugPlus/1.0}
    ports:
      # Bound to loopback: a reverse proxy on the host terminates TLS and
      # forwards to it. Never publish the API directly on 0.0.0.0.
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
    driver: bridge
